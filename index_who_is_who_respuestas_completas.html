function setQuestion(label,icon){const target=$('question');target.textContent='';const pic=document.createElement('span');pic.className='qicon';if(icon.startsWith('data:image/')){const img=document.createElement('img');img.src=icon;img.alt='';pic.appendChild(img)}else{pic.textContent=icon}pic.setAttribute('aria-hidden','true');const txt=document.createElement('span');txt.textContent=label;target.append(pic,txt)}
function setOptionText(button,label,icon){const pic=document.createElement('span');pic.className='opticon';if(icon.startsWith('data:image/')){const img=document.createElement('img');img.src=icon;img.alt='';pic.appendChild(img)}else{pic.textContent=icon}pic.setAttribute('aria-hidden','true');const t=document.createElement('span');t.textContent=label;button.append(pic,t)}

const phrase=(q)=>q.label.replace('{pronoun}', genderKnown==='boy'?'he':'she');
function speak(t){if(!('speechSynthesis'in window))return;const s=window.speechSynthesis;s.cancel();let v=s.getVoices().filter(v=>/^en[-_]/i.test(v.lang));let pick=v.find(v=>/^en-GB/i.test(v.lang)&&/natural|neural|google|microsoft|serena|sonia|daniel/i.test(v.name))||v.find(v=>/^en-GB/i.test(v.lang))||v[0];const m=new SpeechSynthesisUtterance(t);m.lang=pick?.lang||'en-GB';if(pick)m.voice=pick;m.rate=.88;s.speak(m)}

function render(){
 const board=$('board');board.innerHTML='';people.forEach((p,i)=>{let b=document.createElement('button');b.className='person'+(disabled.has(i)?' off':'');b.setAttribute('aria-label',p.name+' — tap to cross out');const picture=document.createElement('img');picture.className='pic';picture.src=p.photo;picture.alt='Fictional portrait: '+p.name;b.appendChild(picture);const name=document.createElement('div');name.className='name';name.textContent=p.name;b.appendChild(name);b.onclick=()=>{if(disabled.has(i))disabled.delete(i);else disabled.add(i);render()};board.appendChild(b)});
 const opts=$('options');opts.innerHTML='';
 if(!genderKnown){[['boy','Is it a boy?','¿Es un chico?'],['girl','Is it a girl?','¿Es una chica?']].forEach(([g,l,es])=>{let b=document.createElement('button');b.className='option gender'+(selected===g?' chosen':'');setOptionText(b,l,g==='boy'?'♂️':'♀️');b.onclick=()=>{selected=g;setQuestion(l,g==='boy'?'♂️':'♀️');render()};opts.appendChild(b)})}
 else {let level=+$('level').value;qs.forEach((q,i)=>{if(q.min>level)return;let b=document.createElement('button');b.className='option'+(selected===i?' chosen':'');setOptionText(b,phrase(q),questionIcons[i]);b.onclick=()=>{selected=i;setQuestion(phrase(q),questionIcons[i]);render()};opts.appendChild(b)})}
 const guesses=$('guesses');guesses.innerHTML='';people.forEach((p,i)=>{let b=document.createElement('button');b.className='alt';b.textContent=p.name;b.disabled=genderKnown===null||disabled.has(i)||finished;b.onclick=()=>guess(i);guesses.appendChild(b)});
 $('modeInfo').textContent=$('mode').value==='class'?'🏫 CLASSROOM · Ask together!':'🏠 HOME · Find the secret person!';$('instructions').textContent=genderKnown===null?'FIRST: Is it a boy or a girl?':'Now ask questions with '+(genderKnown==='boy'?'HE':'SHE')+'. Touch portraits to cross them out.';
}
function fullAnswer(yes, question){
 const q=question.trim().toLowerCase();
 if(q.startsWith('is it '))return yes?'Yes, it is.':"No, it isn't.";
 const subject=genderKnown==='boy'?'he':'she';
 if(q.startsWith('has '))return yes?'Yes, '+subject+' has.':'No, '+subject+" hasn't.";
 return yes?'Yes, '+subject+' is.':'No, '+subject+" isn't.";
}
function ask(){if(finished)return;if(selected===null){$('answer').textContent='👆 CHOOSE A QUESTION';$('answer').className='answer';return}
 if(genderKnown===null){let g=selected,yes=people[secret].gender===g;asked++;$('count').textContent='QUESTIONS: '+asked;const response=fullAnswer(yes,selected==='boy'?'Is it a boy?':'Is it a girl?');$('answer').textContent=(yes?'✅ ':'❌ ')+response;$('answer').className='answer '+(yes?'yes':'no');genderKnown=yes?g:(g==='boy'?'girl':'boy');people.forEach((p,i)=>{if(p.gender!==genderKnown)disabled.add(i)});selected=null;setQuestion(genderKnown==='boy'?'Now ask with HE!':'Now ask with SHE!','💬');render();speak(response);return}
 let q=qs[selected],yes=q.pred(people[secret]);asked++;$('count').textContent='QUESTIONS: '+asked;const response=fullAnswer(yes,phrase(q));$('answer').textContent=(yes?'✅ ':'❌ ')+response;$('answer').className='answer '+(yes?'yes':'no');speak(phrase(q)+' '+response)}
function guess(i){if(finished||genderKnown===null)return;if(i===secret){finished=true;$('answer').textContent='🤩 WELL DONE! '+people[i].name.toUpperCase()+'!';$('answer').className='answer win';speak('Well done! The mystery person is '+people[i].name+'.');render()}
 else{$('answer').textContent='🤔 TRY AGAIN!';$('answer').className='answer no';speak('Try again!');disabled.add(i);render()}}
$('ask').onclick=ask;$('voice').onclick=()=>{if(selected===null)speak('Is it a boy or a girl?');else if(genderKnown===null)speak(selected==='boy'?'Is it a boy?':'Is it a girl?');else speak(phrase(qs[selected]))};$('new').onclick=start;$('level').onchange=start;$('mode').onchange=start;start();
</script></body></html>
